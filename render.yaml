services:
  - type: web
    name: frontend
    runtime: node
    region: frankfurt
    buildCommand: npm install && cd apps/frontend && node build.js --js && node build.js --css
    startCommand: cd apps/frontend && node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ORIGIN
        value: https://typegear.app
      - key: API_MOBILITY_URL
        fromService:
          type: pserv
          name: api-mobility
          property: hostport
      - key: API_REALESTATE_URL
        fromService:
          type: pserv
          name: api-realestate
          property: hostport

  - type: pserv
    name: api-mobility
    runtime: node
    region: frankfurt
    buildCommand: npm install
    startCommand: cd apps/api-mobility && node src/server.js --db /data/data.db
    disk:
      name: api-mobility-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24

  - type: pserv
    name: api-realestate
    runtime: node
    region: frankfurt
    buildCommand: npm install
    startCommand: cd apps/api-realestate && node src/server.js --db /data/data.db
    disk:
      name: api-realestate-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
