<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed background — safe for maskable icons -->
  <rect width="512" height="512" fill="#0057b8"/>
  <!-- Storefront icon, centred in the 80% safe zone (approx 410×410 at centre) -->
  <g transform="translate(256,256)" fill="white">
    <!-- Roof / awning -->
    <polygon points="-120,-60 0,-130 120,-60" opacity="0.9"/>
    <!-- Building body -->
    <rect x="-100" y="-60" width="200" height="130" rx="4"/>
    <!-- Door -->
    <rect x="-28" y="10" width="56" height="60" rx="4" fill="#0057b8"/>
    <!-- Left window -->
    <rect x="-88" y="-40" width="44" height="44" rx="4" fill="#0057b8" opacity="0.6"/>
    <!-- Right window -->
    <rect x="44" y="-40" width="44" height="44" rx="4" fill="#0057b8" opacity="0.6"/>
  </g>
</svg>
